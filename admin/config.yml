backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Status", name: "status", widget: "select", options: ["Active", "Past"] }
      - { label: "Short Blurb", name: "description", widget: "text" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Body Content", name: "body", widget: "markdown" }

  # FIXED: Added the 'files:' key under exec
  - name: "exec"
    label: "Executive Board"
    files:
      - name: "exec_members"
        label: "Exec Members List"
        file: "_data/exec.yml"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image" }