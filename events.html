<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Calendar | EWB-USA CWRU</title>
  <link rel="stylesheet" href="/admin/assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="/admin/assets/images/logo.png" alt="Logo" onerror="this.style.display='none'">
      <div class="logo-text">Humanitarian Design Corporation</div>
    </div>
    <nav>
      <a href="/">Home</a>
      <a href="/about.html">About Us</a>
      <a href="/projects.html">Projects</a>
      <a href="/events.html">Events</a>
      <a href="/admin/" style="color: var(--ewb-blue);">Admin Login</a>
    </nav>
  </header>

  <section class="section">
    <h1 class="section-title">Chapter Calendar & Events</h1>
    <p style="text-align: center; margin-bottom: 2rem;">Join us for general body meetings, project work sessions, and workshops.</p>

    <!-- Calendar Embed Container -->
    <div style="background: white; padding: 1rem; border-radius: 8px; border: 1px solid var(--ewb-border); box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      <!-- Replace src URL with your chapter's public Google Calendar embed URL -->
      <iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FNew_York" 
              style="border: 0; width: 100%; height: 600px; border-radius: 4px;" 
              frameborder="0" 
              scrolling="no">
      </iframe>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div style="font-weight: bold; color: var(--ewb-blue);">HDC | EWB-USA CWRU</div>
    <div>hdc-ewb@case.edu</div>
  </footer>

</body>
</html>
